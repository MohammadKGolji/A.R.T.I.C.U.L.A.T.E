<!-- Wavesurfer & Wavesurfer plugin Record was used to create audio wave. Code was taken from Github: https://github.com/katspaugh/wavesurfer.js/. CanvasRenderingContext2D: roundRect() was used to alter waveform shape and code was taken from https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/roundRect. Button play/pause script was taken and altered from https://stackoverflow.com/questions/24278469/click-a-button-programmatically-js.  -->
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://unpkg.com/wavesurfer.js@7">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="myStyle.css">
</head> 
<body>


 <div class="top-left-fixed">A.R.T.I.C.U.L.A.T.E.</div>
 <div class="top-spacer"></div>
  <div class="page">

   

<div class="button-wrapper">
<div class="liquid-wrapper">
    <div class="liquid_shape liquid-body"></div>
    </div>
    <div class="button-body">
        <img id="myImage" src="Images/Play_Button.png" onclick="changeImage()">
    </div>
</div>


  </div>
 <div id="waveform" class= "audio-container">
 
 </div>

<script type="module">
  import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';
  import RecordPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/record.esm.js';

  const myButton = document.querySelector('.button-body');
  const smoothedHeights = new Array(28).fill(4);
  let isRecording = false;
  let hasStarted = false;

  const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#FFFFFF',
    progressColor: '#383351',
    height: 200,
    barWidth: 12,
    barGap: 7,
    barRadius: 10,
    renderFunction: (channels, ctx) => {
      const { width, height } = ctx.canvas;
      const BAR_COUNT = 28;
      const BAR_WIDTH = 12;
      const BAR_GAP = 9;
      const BAR_RADIUS = 6;
      const centerY = height / 2;
      const data = channels[0];

      ctx.fillStyle = '#FFFFFF99';

      for (let i = 0; i < BAR_COUNT; i++) {
        const index = Math.floor(i * data.length / BAR_COUNT);

        if (isRecording) {
          const raw = Math.abs(data[index]) * height * 1.5;
          smoothedHeights[i] = smoothedHeights[i] * 0.85 + raw * 0.15;
        }

        const edge = Math.min(i, BAR_COUNT - 1 - i);
        const taper = edge < 2 ? 0.4 : 1;
        const barHeight = Math.max(4, smoothedHeights[i] * taper);

        const x = i * (BAR_WIDTH + BAR_GAP) + (width - BAR_COUNT * (BAR_WIDTH + BAR_GAP)) / 2;
        const y = centerY - barHeight / 2;

        ctx.beginPath();
        ctx.roundRect(x, y, BAR_WIDTH, barHeight, BAR_RADIUS);
        ctx.fill();
      }
    }
  });

  const recorder = wavesurfer.registerPlugin(
    RecordPlugin.create({ scrollingWaveform: false })
  );

  myButton.addEventListener('click', () => {
    if (!hasStarted) {
      recorder.startRecording();
      hasStarted = true;
      isRecording = true;
      return;
    }

    if (isRecording) {
      recorder.pauseRecording();
      isRecording = false;
      const flatten = setInterval(() => {
        let allFlat = true;
        for (let i = 0; i < smoothedHeights.length; i++) {
          smoothedHeights[i] *= 0.85;
          if (smoothedHeights[i] > 4) allFlat = false;
          else smoothedHeights[i] = 4;
        }
        if (allFlat) clearInterval(flatten);
      }, 16);
    } else {
      recorder.resumeRecording();
      isRecording = true;
    }
  });
</script>

<script> 
 
const elements = document.querySelectorAll('.liquid-body');

function changeImage() {
var img = document.getElementById('myImage')

if (img.src.match("Images/Play_Button.png")) {
img.src = "Images/Pause_Button.png"; 

scaleUp();

}

else {
img.src = "Images/Play_Button.png"; 
scaleDown();
}



}

function scaleUp() {

	elements.forEach(el => {
	 
	 el.style.transform = 'scale(1.1)';
	 el.classList.add("pulsing");

	 
	});
	
	 
	}
	
function scaleDown() {
    elements.forEach(el => {
        el.style.transform = 'scale(1)';
        el.classList.remove("pulsing");

    });
}
</script>

</body>
