<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.R.T.I.C.U.L.A.T.E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0f;
      --surface: #15151a;
      --ring:    #1e1e26;
      --accent:  #c8f0d8;
      --accent2: #7edba8;
      --text:    #eeeef0;
      --muted:   #6b6b7a;
      --danger:  #f08080;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(126,219,168,.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 20%, rgba(200,240,216,.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -.02em;
      color: var(--text);
      margin-bottom: .35rem;
      opacity: 0;
      animation: fadeUp .8s .1s ease forwards;
    }
    .wordmark em { font-style: italic; color: var(--accent2); }

    .tagline {
      font-size: .82rem;
      color: var(--muted);
      letter-spacing: .09em;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp .8s .25s ease forwards;
    }

    .btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeUp .8s .4s ease forwards;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--accent2);
      opacity: 0;
      pointer-events: none;
    }
    .ring-1 { width: 140px; height: 140px; }
    .ring-2 { width: 185px; height: 185px; }
    .ring-3 { width: 230px; height: 230px; }

    .recording .ring-1 { animation: pulse 2s .0s ease-out infinite; }
    .recording .ring-2 { animation: pulse 2s .4s ease-out infinite; }
    .recording .ring-3 { animation: pulse 2s .8s ease-out infinite; }

    @keyframes pulse {
      0%   { opacity: .6; transform: scale(.85); }
      100% { opacity: 0;  transform: scale(1.1); }
    }

    .btn-record {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--surface);
      box-shadow: 0 0 0 1.5px var(--ring), 0 8px 40px rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      outline: none;
    }
    .btn-record:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 0 0 1.5px var(--accent2), 0 12px 48px rgba(0,0,0,.6);
    }
    .btn-record:active:not(:disabled) { transform: scale(.97); }
    .btn-record:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-record svg { width: 36px; height: 36px; }

    .icon-mic  { display: block; }
    .icon-stop { display: none;  }
    .recording .btn-record { background: #1e1015; box-shadow: 0 0 0 1.5px var(--danger), 0 12px 48px rgba(0,0,0,.6); }
    .recording .icon-mic   { display: none;  }
    .recording .icon-stop  { display: block; }

    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
      margin-top: 1.8rem;
      opacity: 0;
      transition: opacity .3s;
    }
    .waveform.visible { opacity: 1; }
    .bar { width: 3px; border-radius: 2px; background: var(--accent2); height: 6px; }
    .waveform.visible .bar:nth-child(1) { animation: wave 1.1s .0s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(2) { animation: wave 1.1s .1s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(3) { animation: wave 1.1s .2s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(4) { animation: wave 1.1s .3s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(5) { animation: wave 1.1s .4s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(6) { animation: wave 1.1s .3s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(7) { animation: wave 1.1s .2s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(8) { animation: wave 1.1s .1s ease-in-out infinite alternate; }
    .waveform.visible .bar:nth-child(9) { animation: wave 1.1s .0s ease-in-out infinite alternate; }

    @keyframes wave {
      from { height: 4px;  opacity: .4; }
      to   { height: 22px; opacity: 1;  }
    }

    .spinner-wrap { height: 28px; margin-top: 1.8rem; display: flex; align-items: center; justify-content: center; }
    .spinner { display: none; width: 18px; height: 18px; border: 2px solid var(--ring); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      margin-top: 1rem;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color .3s;
      opacity: 0;
      animation: fadeUp .8s .55s ease forwards;
    }
    .status.active   { color: var(--accent2); }
    .status.error    { color: var(--danger);  }
    .status.working  { color: var(--accent);  }
    .status.warming  { color: var(--muted);   }

    /* Warming up dot pulse */
    .dot-pulse::after {
      content: '';
      display: inline-block;
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .footer {
      position: fixed;
      bottom: 1.8rem;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .04em;
      opacity: 0;
      animation: fadeUp .8s .7s ease forwards;
    }
  </style>
</head>
<body>

<div class="shell">
  <h1 class="wordmark">A.R.T.I.C.U.L.A.T.E</h1>
  <p class="tagline">Speak freely &middot; be understood</p>

  <div class="btn-wrap" id="btnWrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <button class="btn-record" id="btn" aria-label="Start recording" disabled>
      <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
      <svg class="icon-stop" viewBox="0 0 24 24" fill="var(--danger)" stroke="none">
        <rect x="5" y="5" width="14" height="14" rx="2"/>
      </svg>
    </button>
  </div>

  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="spinner-wrap">
    <div class="spinner" id="spinner"></div>
  </div>

  <p class="status warming dot-pulse" id="status">Connecting</p>
</div>

<p class="footer">Grammar Police &mdash; Apps for Good 2026</p>

<script>
  // Replace with your HuggingFace Space URL.
  // Format: https://YOURUSERNAME-SPACENAME.hf.space
  const SPACE_URL = "https://pineappleananas-speechcorrection.hf.space";

  const API_PATHS = {
    upload: ["/upload", "/gradio_api/upload"],
    predict: ["/call/process_audio", "/gradio_api/call/process_audio", "/call/predict", "/gradio_api/call/predict"],
  };

  const HEALTH_URL = SPACE_URL + "/";

  const btn      = document.getElementById("btn");
  const wrap     = document.getElementById("btnWrap");
  const status   = document.getElementById("status");
  const spinner  = document.getElementById("spinner");
  const waveform = document.getElementById("waveform");

  let mediaRecorder = null;
  let audioChunks   = [];
  let isRecording   = false;
  let serverReady   = false;
  let isBusy        = false;
  let healthRetries = 0;

  const MAX_HEALTH_RETRIES = 15;
  const REQUEST_TIMEOUT_MS = 20000;

  function setStatus(msg, cls) {
    status.textContent = msg;
    status.className   = "status " + (cls || "");
  }

  async function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, timeoutMs || REQUEST_TIMEOUT_MS);

    try {
      return await fetch(url, Object.assign({}, options || {}, { signal: controller.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function readErrorBody(res) {
    try {
      const body = await res.text();
      return body ? body.slice(0, 180) : "";
    } catch (e) {
      return "";
    }
  }

  function extractTextFromPayload(payload) {
    if (typeof payload === "string") return payload.trim() || null;

    if (Array.isArray(payload)) {
      for (const item of payload) {
        const text = extractTextFromPayload(item);
        if (text) return text;
      }
      return null;
    }

    if (!payload || typeof payload !== "object") return null;

    if (typeof payload.corrected === "string" && payload.corrected.trim()) return payload.corrected.trim();
    if (typeof payload.text === "string" && payload.text.trim()) return payload.text.trim();
    if (typeof payload.raw === "string" && payload.raw.trim()) return payload.raw.trim();

    if (Array.isArray(payload.data)) {
      for (const item of payload.data) {
        const text = extractTextFromPayload(item);
        if (text) return text;
      }
    }

    if (payload.output) {
      const outText = extractTextFromPayload(payload.output);
      if (outText) return outText;
    }

    return null;
  }

  function parseSSEPayload(resultText) {
    const lines = resultText.split("\n");
    let currentEvent = "";
    let bestText = null;
    let fallbackText = null;
    let serverError = null;
    let lastDataSnippet = null;

    for (const line of lines) {
      if (line.startsWith("event:")) {
        currentEvent = line.slice(6).trim().toLowerCase();
        continue;
      }

      if (!line.startsWith("data: ")) continue;
      const raw = line.slice(6).trim();
      if (!raw || raw === "[DONE]") continue;

      let payload;
      try {
        payload = JSON.parse(raw);
        lastDataSnippet = raw;
      } catch (e) {
        continue;
      }

      if (currentEvent === "error") {
        if (payload && typeof payload === "object" && payload.error) {
          serverError = String(payload.error);
        }
        continue;
      }

      const text = extractTextFromPayload(payload);
      if (!text) continue;

      if (currentEvent === "complete" || currentEvent === "output") {
        bestText = text;
      } else if (!fallbackText) {
        fallbackText = text;
      }
    }

    if (bestText) return { text: bestText, error: null };
    if (fallbackText) return { text: fallbackText, error: null };
    if (serverError) return { text: null, error: serverError };
    if (lastDataSnippet) {
      return { text: null, error: "No usable result from server: " + lastDataSnippet.slice(0, 140) };
    }
    return { text: null, error: "No usable result from server" };
  }

  async function postJSONWithFallback(paths, payloadOrBuilder) {
    let lastErr = null;

    for (const path of paths) {
      const candidatePayloads = typeof payloadOrBuilder === "function"
        ? payloadOrBuilder(path)
        : payloadOrBuilder;
      const payloads = Array.isArray(candidatePayloads) ? candidatePayloads : [candidatePayloads];

      for (const payload of payloads) {
        try {
          const res = await fetchWithTimeout(SPACE_URL + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (res.status === 404) {
            lastErr = new Error("Not found: " + path);
            break;
          }

          if (!res.ok) {
            const body = await readErrorBody(res);
            lastErr = new Error("Request failed (" + res.status + ")" + (body ? ": " + body : ""));
            continue;
          }

          const data = await res.json();
          return { path: path, data: data };
        } catch (e) {
          lastErr = e;
        }
      }
    }

    throw lastErr || new Error("No working endpoint found");
  }

  async function postFormWithFallback(paths, formData) {
    let lastErr = null;

    for (const path of paths) {
      try {
        const res = await fetchWithTimeout(SPACE_URL + path, {
          method: "POST",
          body: formData,
        });

        if (res.status === 404) {
          lastErr = new Error("Not found: " + path);
          continue;
        }

        if (!res.ok) {
          const body = await readErrorBody(res);
          throw new Error("Request failed (" + res.status + ")" + (body ? ": " + body : ""));
        }

        const data = await res.json();
        return { path: path, data: data };
      } catch (e) {
        lastErr = e;
      }
    }

    throw lastErr || new Error("No working endpoint found");
  }

  function extractUploadedFilePath(uploadData) {
    if (Array.isArray(uploadData) && uploadData[0]) {
      if (typeof uploadData[0] === "string") return uploadData[0];
      if (uploadData[0] && typeof uploadData[0] === "object") {
        if (typeof uploadData[0].path === "string") return uploadData[0].path;
        if (typeof uploadData[0].name === "string") return uploadData[0].name;
      }
    }

    if (uploadData && typeof uploadData === "object") {
      if (typeof uploadData.path === "string") return uploadData.path;
      if (typeof uploadData.file === "string") return uploadData.file;
      if (uploadData.data && Array.isArray(uploadData.data) && uploadData.data[0]) {
        if (typeof uploadData.data[0] === "string") return uploadData.data[0];
        if (uploadData.data[0] && typeof uploadData.data[0].path === "string") {
          return uploadData.data[0].path;
        }
      }
    }

    return null;
  }

  function createFileDataFromUpload(uploadData) {
    const filePath = extractUploadedFilePath(uploadData);
    if (!filePath) return null;

    if (Array.isArray(uploadData) && uploadData[0] && typeof uploadData[0] === "object") {
      const obj = uploadData[0];
      if (obj.meta && obj.meta._type === "gradio.FileData") return obj;
    }

    return {
      path: filePath,
      orig_name: "recording.webm",
      meta: { _type: "gradio.FileData" },
    };
  }

  function buildPredictPayloads(fileData, endpointPath) {
    const filePath = fileData && typeof fileData === "object" ? fileData.path : fileData;
    if (endpointPath.indexOf("process_audio") !== -1) {
      return [
        { data: [fileData] },
        { data: [{ path: filePath, orig_name: "recording.webm", meta: { _type: "gradio.FileData" } }] },
        { data: [{ path: filePath, orig_name: "recording.webm" }] },
        { data: [{ path: filePath }] },
        { data: [filePath] },
        { audio_path: fileData },
        { audio_path: { path: filePath, orig_name: "recording.webm", meta: { _type: "gradio.FileData" } } },
        { audio_path: { path: filePath, orig_name: "recording.webm" } },
        { audio_path: filePath },
      ];
    }

    return [
      { data: [{ path: filePath }] },
      { data: [filePath] },
    ];
  }

  function resultPathFromPredictPath(predictPath, eventId) {
    return predictPath + "/" + eventId;
  }

  async function getTextWithFallback(paths) {
    let lastErr = null;

    for (const path of paths) {
      try {
        const res = await fetchWithTimeout(SPACE_URL + path, {}, 30000);

        if (res.status === 404) {
          lastErr = new Error("Not found: " + path);
          continue;
        }

        if (!res.ok) {
          const body = await readErrorBody(res);
          throw new Error("Request failed (" + res.status + ")" + (body ? ": " + body : ""));
        }

        return await res.text();
      } catch (e) {
        lastErr = e;
      }
    }

    throw lastErr || new Error("No working endpoint found");
  }

  function waitForServer() {
    fetchWithTimeout(HEALTH_URL, {}, 8000)
      .then(function(res) {
        if (res.ok) {
          serverReady  = true;
          btn.disabled = false;
          healthRetries = 0;
          setStatus("Tap to speak");
        } else {
          healthRetries += 1;
          if (healthRetries >= MAX_HEALTH_RETRIES) {
            setStatus("Server unavailable", "error");
            return;
          }
          setTimeout(waitForServer, 4000);
        }
      })
      .catch(function() {
        healthRetries += 1;
        if (healthRetries >= MAX_HEALTH_RETRIES) {
          setStatus("Server unavailable", "error");
          return;
        }
        setTimeout(waitForServer, 4000);
      });
  }

  window.addEventListener("load", function() {
    waitForServer();
  });

  async function startRecording() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        setStatus("Browser does not support recording", "error");
        return;
      }

      const stream  = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks   = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = handleStop;
      mediaRecorder.start();

      isRecording = true;
      wrap.classList.add("recording");
      waveform.classList.add("visible");
      setStatus("Recording...", "active");

    } catch (err) {
      setStatus("Microphone access denied", "error");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(function(t) { t.stop(); });
      isRecording = false;
      wrap.classList.remove("recording");
      waveform.classList.remove("visible");
    }
  }

  async function handleStop() {
    if (isBusy) return;
    isBusy = true;
    btn.disabled = true;
    spinner.classList.add("visible");
    setStatus("Processing...", "working");

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    if (!blob || blob.size === 0) {
      spinner.classList.remove("visible");
      setStatus("No audio captured", "error");
      isBusy = false;
      btn.disabled = !serverReady;
      return;
    }

    // Gradio API: first POST to get an event_id, then GET the result.
    try {
      const formData = new FormData();
      formData.append("files", blob, "recording.webm");

      // Step 1: upload the audio file to the Space.
      const uploadCall = await postFormWithFallback(API_PATHS.upload, formData);
      const uploadData = uploadCall.data;
      const fileData = createFileDataFromUpload(uploadData);
      if (!fileData) {
        throw new Error("Upload response missing file path");
      }

      // Step 2: call the predict endpoint with the uploaded file path.
      const predictCall = await postJSONWithFallback(API_PATHS.predict, function(path) {
        return buildPredictPayloads(fileData, path);
      });
      const predictData = predictCall.data;
      const eventId     = predictData.event_id;
      if (!eventId) throw new Error("Predict response missing event id");

      // Step 3: poll for the result.
      const resultPaths = [
        resultPathFromPredictPath(predictCall.path, eventId),
        "/call/process_audio/" + eventId,
        "/gradio_api/call/process_audio/" + eventId,
        "/call/predict/" + eventId,
        "/gradio_api/call/predict/" + eventId,
      ];
      const resultText = await getTextWithFallback(resultPaths);

      const parsed = parseSSEPayload(resultText);
      if (!parsed.text) {
        throw new Error(parsed.error || "No usable result from server");
      }
      const corrected = parsed.text;

      spinner.classList.remove("visible");
      setStatus("Speaking...", "active");

      if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
        setStatus("Done (speech unsupported)", "error");
      } else {
        const utterance = new SpeechSynthesisUtterance(corrected);
        utterance.lang  = "en-US";
        utterance.rate  = 0.95;
        utterance.onend = function() { setStatus("Tap to speak"); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }

    } catch (err) {
      spinner.classList.remove("visible");
      const msg = err && err.message ? err.message : "Unexpected failure";
      setStatus(msg, "error");
      console.error(err);
      setTimeout(function() { setStatus("Tap to speak"); }, 3000);
    } finally {
      isBusy = false;
      btn.disabled = !serverReady;
    }
  }

  btn.addEventListener("click", function() {
    if (!serverReady || isBusy) return;
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

</script>

</body>
</html>
